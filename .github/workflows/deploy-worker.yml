name: Deploy Cloudflare Worker
on:
    workflow_dispatch:
    push:
        branches:
            - "master"
        paths:
            - "src/**"
            - "worker/**"
            - "Dockerfile"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/deploy-worker.yml"

concurrency:
    group: deploy-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: worker
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ALLOWME_WORKER_NAME: ${{ secrets.ALLOWME_WORKER_NAME || 'cloudflare-allowme' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: worker/package-lock.json
            - run: npm ci
            - name: Deploy worker and container
              env:
                  ALLOWME_DOMAIN: ${{ secrets.ALLOWME_DOMAIN }}
                  ALLOWME_CF_ZONE: ${{ secrets.ALLOWME_CF_ZONE }}
                  ALLOWME_CONTAINER_NAME: ${{ secrets.ALLOWME_CONTAINER_NAME }}
              run: |
                  : "${ALLOWME_DOMAIN:?Missing ALLOWME_DOMAIN secret}"
                  : "${ALLOWME_CF_ZONE:?Missing ALLOWME_CF_ZONE secret}"
                  if [ -n "$ALLOWME_CONTAINER_NAME" ]; then
                      jq --arg n "$ALLOWME_CONTAINER_NAME" '.containers[0].name = $n' wrangler.jsonc > wrangler.tmp && mv wrangler.tmp wrangler.jsonc
                  fi
                  npx wrangler deploy --name "$ALLOWME_WORKER_NAME" --domain "$ALLOWME_DOMAIN" --var "ALLOWME_CF_ZONE:$ALLOWME_CF_ZONE"
            - name: Update worker secrets
              env:
                  ALLOWME_CF_TOKEN: ${{ secrets.ALLOWME_CF_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
                  ALLOWME_SERVER_SECRET: ${{ secrets.ALLOWME_SERVER_SECRET }}
              run: |
                  jq -n --arg t "$ALLOWME_CF_TOKEN" --arg s "$ALLOWME_SERVER_SECRET" '{ALLOWME_CF_TOKEN: $t, ALLOWME_SERVER_SECRET: $s}' | npx wrangler secret bulk --name "$ALLOWME_WORKER_NAME"
