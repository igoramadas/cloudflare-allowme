name: Deploy Cloudflare Worker
on:
    workflow_dispatch:
    push:
        branches:
            - "master"
        paths:
            - "src/**"
            - "worker/**"
            - "Dockerfile"
            - "package.json"
            - "package-lock.json"
            - ".github/workflows/deploy-worker.yml"

concurrency:
    group: deploy-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: worker
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: worker/package-lock.json
            - run: npm ci
            - name: Deploy worker and container
              env:
                  ALLOWME_DOMAIN: ${{ secrets.ALLOWME_DOMAIN }}
                  ALLOWME_CF_ZONE: ${{ secrets.ALLOWME_CF_ZONE }}
              run: npx wrangler deploy --domain "$ALLOWME_DOMAIN" --var "ALLOWME_CF_ZONE:$ALLOWME_CF_ZONE"
            - name: Update worker secrets
              env:
                  ALLOWME_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  ALLOWME_SERVER_SECRET: ${{ secrets.ALLOWME_SERVER_SECRET }}
              run: |
                  jq -n --arg t "$ALLOWME_CF_TOKEN" --arg s "$ALLOWME_SERVER_SECRET" '{ALLOWME_CF_TOKEN: $t, ALLOWME_SERVER_SECRET: $s}' | npx wrangler secret bulk
